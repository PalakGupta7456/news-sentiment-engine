name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/palakgupta7456/news-sentiment-engine

jobs:
  test:
    name: Lint and tests (lightweight models)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[api,dev]"
      - run: ruff check .
      - run: pytest -v

  model-smoke:
    name: Transformer smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/newsmood/config.py') }}
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ml]"
      - name: Real models give sensible answers
        run: |
          python - <<'PY'
          from newsmood.models import load
          s, e = load()
          p = s.predict(["Earthquake kills hundreds and destroys homes", "Team celebrates historic championship win", "Council meets on Tuesday"])
          print(p.round(3))
          assert p[0].argmax() == 0 and p[1].argmax() == 2, "sentiment sanity check failed"
          v = e.encode(["Central bank raises interest rates", "Fed hikes rates again", "Volcano erupts in Iceland"])
          print("sim related", float(v[0] @ v[1]), "unrelated", float(v[0] @ v[2]))
          assert v[0] @ v[1] > v[0] @ v[2] + 0.2, "embedding sanity check failed"
          PY

  docker:
    name: Build, smoke test and push image
    needs: [test, model-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 ${{ env.IMAGE }}:${{ github.sha }}
          for i in $(seq 1 40); do curl -fs localhost:8000/health && break; sleep 3; done
          curl -fs -X POST localhost:8000/analyze -H 'content-type: application/json' -d '{"text":"Floods kill dozens in coastal towns"}' | tee out.json
          grep -q '"label":"negative"' out.json
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          docker tag ${{ env.IMAGE }}:${{ github.sha }} ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ github.sha }} && docker push ${{ env.IMAGE }}:latest
