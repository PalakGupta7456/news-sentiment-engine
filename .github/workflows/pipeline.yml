name: Hourly news pipeline

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/newsmood/config.py') }}
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ml]"

      - name: Restore article history
        run: |
          mkdir -p data docs/data
          if git fetch --depth 1 origin live-data; then git archive FETCH_HEAD | tar -x -C .; fi

      - name: Ingest, score, discover stories, publish
        run: python -m newsmood.pipeline

      - name: Save history to live-data branch
        run: |
          STATE=$(mktemp -d)
          mkdir -p "$STATE/data" "$STATE/docs/data"
          cp data/articles.parquet "$STATE/data/"
          cp docs/data/dashboard.json "$STATE/docs/data/"
          cd "$STATE"
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "News state $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live-data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
